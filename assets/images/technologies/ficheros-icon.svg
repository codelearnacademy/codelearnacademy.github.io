    <path d="M12 15.5h25l7 7V49a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V19.5a4 4 0 0 1 4-4Z" opacity=".28"/>
    <path d="M18 10.5h25l7 7V44a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V14.5a4 4 0 0 1 4-4Z" opacity=".55"/>
    <path d="M24 6h24l8 8v25a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Z" fill="#eff6ff"/>
    <path d="M48 6v8h8"/>

    <!-- Símbolos de formatos -->
    <!-- properties -->
    <path d="M27 20h8M38 20h11"/>
    <!-- CSV / filas -->
    <path d="M27 26h6M36 26h6M45 26h4"/>
    <path d="M27 31h6M36 31h6M45 31h4"/>
