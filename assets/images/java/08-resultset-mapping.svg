<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" role="img" aria-label="ResultSet: del cursor a un objeto"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#145593"/></marker></defs><rect width="1440" height="740" fill="#fafcfe"/><g font-family="DejaVu Sans,sans-serif" fill="#122343"><text x="60" y="88" font-size="49" font-weight="bold">ResultSet: del cursor a un objeto</text><path d="M450 312 H523" fill="none" stroke="#145593" stroke-width="4" marker-end="url(#a)"/><text x="0" y="0" font-size="24" fill="#145593"></text><path d="M915 312 H988" fill="none" stroke="#145593" stroke-width="4" marker-end="url(#a)"/><text x="0" y="0" font-size="24" fill="#145593"></text><rect x="60" y="239" width="390" height="145" rx="20" fill="#E1F3FF" stroke="#8EB7D9" stroke-width="2"/><text x="255" y="300.5" text-anchor="middle" font-size="32">Antes de next()</text><text x="255" y="341.5" text-anchor="middle" font-size="32">Cursor antes de las filas</text><rect x="525" y="239" width="390" height="145" rx="20" fill="#E6F7EC" stroke="#8EB7D9" stroke-width="2"/><text x="720" y="300.5" text-anchor="middle" font-size="32">next() devuelve true</text><text x="720" y="341.5" text-anchor="middle" font-size="32">Fila actual: ID 2</text><rect x="990" y="239" width="390" height="145" rx="20" fill="#FFF0D8" stroke="#8EB7D9" stroke-width="2"/><text x="1185" y="300.5" text-anchor="middle" font-size="32">Lee las columnas</text><text x="1185" y="341.5" text-anchor="middle" font-size="32">Construye el objeto</text><rect x="60" y="626" width="1320" height="73" rx="19" fill="#11284C"/><text x="85" y="672" font-size="29" fill="white">Si next() devuelve false, ya no hay una fila que leer.</text></g></svg>